# 部门级 comments 全量提取自 dept_std\comments-studyname_sdtm_v1.1.xlsx(key = CommentOID 去 'COM.', description 双语)。项目层面按 datasets/*.yaml 的 comment 引用筛选。
AE.AEENRTPT:
  description_en: 'Set to "ONGOING" if AEOUT="NOT RECOVERED/NOT RESOLVED" or "RECOVERING/RESOLVING";

    Set to "UNKNOWN" if the end date is unknown or AEOUT="UNKNOWN".'
  description_cn: '当AEOUT=”未恢复/未解决“或AEOUT=”恢复中“，设置为”仍持续“；

    当结束日期未知或AEOUT=”未知“时，设置为”未知“.'
CT:
  description_en: 'The latest version of CDISC CT when the study ended.


    or


    CDISC CT applicable for variables is the yyyy-mm-dd version.'
  description_cn: '研究结束时的最新版CDISC CT。


    或


    适用于变量的CDISC CT是 yyyy-mm-dd 版本。'
EGDRVFL:
  description_en: Set to "Y" when EGTESTCD="QTCF".
  description_cn: 当EGTESTCD="QTCF"时，设置为”Y"。
ENRTPT:
  description_en: 'Set to "ONGOING" if the event is ongoing;

    Set to "UNKNOWN" if the end date is unknown.'
  description_cn: '当事件仍在继续，设置为”仍持续“；

    当结束日期未知时，设置为”未知“.'
ENTPT:
  description_en: Description or date/time in ISO 8601 character format of the reference point referenced by --ENTPT.
  description_cn: --ENTPT所参照时点的描述或ISO 8601格式的日期/时间。
EPOCH.SCRN:
  description_en: Set to "SCREENING" based on the study protocol.
  description_cn: 根据试验方案赋值为"筛选期"。
IETEST:
  description_en: Please see Appendix 1 of the cSDRG for complete versions of Inclusion/Exclusion Criteria and their corresponding IETESTCD and IETEST.
  description_cn: 完整的入选/排除标准及其对应的IETESTCD和IETEST可查阅cSDRG中的附录1。
  doc_id: ReviewerGuide
  page_ref_type: PhysicalRef
  page_refs: 1
ISORRESU:
  description_en: Set to "titer" when ISTSTOPO = "QUANTIFY"
  description_cn: 当ISTSTOPO = "QUANTIFY"时，设置为"titer"。
LBSTRESU:
  description_en: Standardized units for laboratory tests. Please see Section 1 of the Complex Algorithms for details.
  description_cn: 各实验室检查项目的标准单位，具体可查阅复杂算法中的第1章节。
  doc_id: ComplexAlgorithms
  page_ref_type: PhysicalRef
  page_refs: 1
MEDDRA:
  description_en: Coding based on --TERM and MedDRA.
  description_cn: 根据--TERM的值和MedDRA字典编码。
NC:
  description_en: Variable was not collected for this study.
  description_cn: 本研究未采集该变量。
ND:
  description_en: No data was collected.
  description_cn: 未收集到数据。
SDTMIG:
  description_en: 'Study Data Tabulation Model Implementation Guide: Human Clinical Trials Version 3.3.'
  description_cn: 临床研究数据列表模型实施指南3.3版。
SDTMIG34:
  description_en: 'Study Data Tabulation Model Implementation Guide: Human Clinical Trials Version 3.4.'
  description_cn: 临床研究数据列表模型实施指南3.4版。
SDTMIGAP:
  description_en: 'Study Data Tabulation Model Implementation Guide: Human Clinical Trials Version 3.3.

    Study Data Tabulation Model Implementation Guide: Associated Persons Version 1.0.'
  description_cn: 临床研究数据列表模型实施指南：关联人员 1.0版。
SPID:
  description_en: Unique record identifier from the raw database. Traceability between RAW, SDTM, and ADaM.
  description_cn: 原始数据库中的唯一记录标识符，用于RAW、SDTM、ADaM间的可追溯性。
SS.VISITDY:
  description_en: Planned study day of the visit based upon RFSTDTC in Demographics.
  description_cn: 基于人口学RFSTDTC的访视计划研究日。
STAT:
  description_en: Used to indicate that a question was not asked or a test was not done, or a test was done but no answer was obtained, or the record is complete.
  description_cn: 用于表示问题未询问、检查未执行、检查已执行但未获得结果，或记录已完成。
STRTPT:
  description_en: Set to "UNKNOWN" if start date is unknown.
  description_cn: 当开始日期未知时，设置为”未知“
TV.ARM:
  description_en: Description of the planned arm or treatment group assigned to the subject at the visit, per protocol.
  description_cn: 按方案，受试者在该访视时被分配的计划分组/治疗组描述。
TV.ARMCD:
  description_en: The timing of visits does not depend on which arm a subject is in, so ARMCD is null.
  description_cn: 试验访视与分组无关，赋空值。
VISIT:
  description_en: Corresponding SV.VISIT based on date/time. Equal to the corresponding TV.VISIT based on collected visit name for records with --STAT = "NOT DONE".
  description_cn: 日期/时间对应的SV.VISIT。对于--STAT = "NOT DONE"的记录等于收集的访视名称对应的TV.VISIT。
VISITNUM:
  description_en: Corresponding SV.VISITNUM based on date/time. Equal to the corresponding TV.VISITNUM based on collected visit name for records with --STAT = "NOT DONE".
  description_cn: 日期/时间对应的SV.VISITNUM。对于--STAT = "NOT DONE"的记录等于收集的访视名称对应的TV.VISITNUM。
WHODRUG:
  description_en: Coding based on CMTRT and WHODrug.
  description_cn: 根据CMTRT的值和WHODrug字典编码。
