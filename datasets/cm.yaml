# 首版 cm.yaml：m5\datasets\tabulations\sdtm\cm.xpt+m5\datasets\tabulations\sdtm\suppcm.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: CM
label: 既往与合并用药
class: 干预类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每次服药或固定给药间隔一条记录
sas_dataset: CM
keys:
- STUDYID
- USUBJID
- SUBJID
- CMCAT
- CMSCAT
- CMTRT
- CMSTDTC
- CMENDTC
- CMSPID
- CMGRPID
archive: cm.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
