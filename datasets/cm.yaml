  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: false
    origin: {type: Collected, source: Investigator}
  CMSEQ:
    label: 序号
    type: integer
    length: '3'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  CMGRPID:
    label: 分组ID
    type: text
    length: '170'
    order: 6
    key_sequence: 10
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '133'
      - '200'
  CMSPID:
    label: 申办方定义标识符
    type: text
    length: '23'
    order: 7
    key_sequence: 9
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
