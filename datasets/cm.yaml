        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '187'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CMDOSUO
        label: 其他单位
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '133'
          - '187'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CMROUTEO
