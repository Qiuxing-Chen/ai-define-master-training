      label: 来源
      type: text
      length: '9'
      order: 9
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QEVAL:
      label: 评估人员
      type: text
      length: '21'
      order: 10
      mandatory: false
      origin: {type: Assigned, source: Sponsor}
