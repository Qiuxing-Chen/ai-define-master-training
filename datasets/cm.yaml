        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '187'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CMDSFQO
        label: 其他给药频率
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '133'
          - '188'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CMPDDTC
        label: 进展日期
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '133'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CMTLN
        label: 治疗线数
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '133'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CMDECOD1
        label: 标准的药物名称1
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CMOUTO
        label: 其他结局
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '133'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CMSCATO
        label: 其他类型
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '133'
        mandatory: false
