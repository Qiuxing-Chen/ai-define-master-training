supplemental:
  domain: SUPPCM
  label: CM补充修饰语数据集
  class: 关联数据
  purpose: 列表
  repeating: true
  is_reference_data: false
  structure: 一个域一个修饰变量一条记录
  sas_dataset: SUPPCM
  keys:
  - STUDYID
  - RDOMAIN
  - USUBJID
  - IDVAR
  - IDVARVAL
  - QNAM
  archive: suppcm.xpt
  variables:
    STUDYID:
      label: 研究标识符
      type: text
      length: '8'
      order: 1
      mandatory: true
      key_sequence: 1
      origin: {type: Protocol, source: Sponsor}
    RDOMAIN:
      label: 关联域名缩写
      type: text
      length: '2'
      order: 2
      mandatory: true
      key_sequence: 2
      origin: {type: Assigned, source: Sponsor}
      codelist: DOMAIN
    USUBJID:
      label: 受试者唯一标识符
      type: text
      length: '23'
      order: 3
      mandatory: true
      key_sequence: 3
      origin: {type: Derived, source: Sponsor}
      method: USUBJID
    IDVAR:
      label: 标识变量
      type: text
      length: '5'
      order: 4
      mandatory: false
      key_sequence: 4
      origin: {type: Assigned, source: Sponsor}
    IDVARVAL:
      label: 标识变量值
      type: text
      length: '3'
      order: 5
      mandatory: false
      key_sequence: 5
      origin: {type: Assigned, source: Sponsor}
    QNAM:
      label: 修饰语变量名称
      type: text
      length: '8'
      order: 6
      mandatory: true
      key_sequence: 6
      origin: {type: Assigned, source: Sponsor}
    QLABEL:
      label: 修饰语变量标签
      type: text
      length: '27'
      order: 7
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QVAL:
      label: 数据值
      type: text
      length: '142'
      order: 8
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
      value_list:
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ATC
        label: 药物类别
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ATC1
        label: 药物类别1
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ATC1CD
        label: 药物类别1编码
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ATC2
        label: 药物类别2
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ATC2CD
        label: 药物类别2编码
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ATC3
        label: 药物类别3
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ATC3CD
        label: 药物类别3编码
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ATC4
        label: 药物类别4
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ATC4CD
        label: 药物类别4编码
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ATCCD
        label: 药物类别编码
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CMCOUR
        label: 总疗程数
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '133'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CMOUT
        label: 治疗结局
        codelist: CMOUT
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '133'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CMPTCD
        label: 标准的药物名称编码
        comment: WHODRUG
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - DICTNAME
